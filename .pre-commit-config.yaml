# Install locally:
#   python -m pip install pre-commit
#   pre-commit install
# Run on a PR-sized change:
#   pre-commit run --from-ref origin/master --to-ref HEAD --show-diff-on-failure

minimum_pre_commit_version: 4.0.0
default_stages: [pre-commit]
fail_fast: false
exclude: ^third_party/

repos:
  # Repository hygiene and basic security checks.
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements

  # Python linting and formatting. Rules are defined in pyproject.toml.
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests|benchmarks|examples)/.*\.py$
      - id: ruff-format
        files: ^(src|tests|benchmarks|examples)/.*\.py$

  # C and C++ formatting. The style is defined in .clang-format.
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        args: [--style=file]
        files: ^(csrc|include|bindings)/.*\.(c|h|cpp|hpp|cc|hh|cxx|hxx)$

  # Documentation and configuration spelling. Project terms are allowlisted.
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [-L, "CANN,cann,AsNumpy,asnumpy"]
        files: ^(README.*|docs/|changes/|\.gitcode/).*

  # Keep type checking available while the existing type-error baseline is
  # cleaned up. This hook is intentionally manual until `mypy src/` is clean.
  # Installing it from the configured Python index avoids a GitHub dependency.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy==1.19.0]
        args: [src/]
        pass_filenames: false
        files: ^src/.*\.py$
        stages: [manual]
