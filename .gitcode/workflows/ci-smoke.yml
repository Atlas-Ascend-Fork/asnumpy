                conda --version || true
                conda info --envs || true
              else
                echo "-- conda not found"
              fi

              section "Ascend / CANN"
              env | grep -E '^ASCEND_|^CANN_|^LD_LIBRARY_PATH=|^PATH=' | sort || true
              for p in /usr/local/Ascend /home/jenkins/Ascend /usr/local/Ascend/ascend-toolkit /home/jenkins/Ascend/ascend-toolkit /usr/local/Ascend/cann; do
