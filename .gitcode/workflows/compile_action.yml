name: compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'x64'
      ref:
        required: true
        type: string
      download_pr_artifacts:
        required: false
        type: string
        default: 'true'
      package_name:
        required: false
        type: string
        default: ''
    outputs:
      arm_run_url:
        value: ${{jobs.JOB_compile.outputs.primary-url}}
      arm_run_key:
        value: ${{jobs.JOB_compile.outputs.primary-key}}

jobs:
  JOB_compile:
    name: Compile
    strategy:
      matrix:
        python_version: ['3.12', '3.13', '3.14']
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true
      - name: setup-python
        uses: setup-python
        with:
          python-version: ${{ matrix.python_version }}
      -
        name: download
        if: ${{ inputs.download_pr_artifacts == 'true' }}
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/compile.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            cd ${{ steps.process_checkout.outputs.path }}
            export task_name=${{ inputs.task_name }}
            export target_branch=${{ env.TARGET_BRANCH }}
            export PYTHON_BIN=$(command -v python)
            export PYTHON_VERSION=${{ matrix.python_version }}
            "$PYTHON_BIN" -c 'import os, sys; sys.exit(0 if f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["PYTHON_VERSION"] else "Python version mismatch")' || exit 1
            BuildAccelerate bash compile.sh
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      -
        name: rename_package
        if: ${{ inputs.package_name != '' }}
        run: |
          cd ${{ steps.process_checkout.outputs.path }}/dist
          wheel_count=$(ls *.whl 2>/dev/null | wc -l)
          if [ "${wheel_count}" != "1" ]; then
            echo "Skip rename: ${wheel_count} wheels present, keeping canonical artifact names."
            exit 0
          fi
          f=$(ls *.whl)
          if [ "$f" != "${{ inputs.package_name }}" ]; then
            mv "$f" "${{ inputs.package_name }}"
            echo "Renamed: $f -> ${{ inputs.package_name }}"
          fi
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: "${{ steps.process_checkout.outputs.path }}/dist/*"
          object-prefix: ${{ env.obs_path }}/py${{ matrix.python_version }}/
    if: "${{ default() }}"
    runs-on:
      - self-hosted
      - arch=${{ inputs.arch }}
      - spec=xlarge
    container:
      image: ${{ inputs.image }}
