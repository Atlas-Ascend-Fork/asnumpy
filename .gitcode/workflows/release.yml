name: release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name }}
  TARGET_BRANCH: ${{ atomgit.ref_name }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/release/${{ atomgit.ref_name }}"
  compile_image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11-devel

stages:
  permission:
    name: Release permission
    fail-fast: true
    jobs:
      JOB_permission:
        name: Maintainer only
        steps:
          - name: Check repository role
            env:
              ACTOR: ${{ atomgit.actor }}
              REPOSITORY: ${{ atomgit.repository }}
              GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
            run: |
              python3 - <<'PY'
              import json, os, urllib.parse, urllib.request
              if os.environ['REPOSITORY'].lower() != 'cann/asnumpy': raise SystemExit('Release requires the main repository')
              actor, token = os.environ['ACTOR'], os.environ['GIT_TOKEN']
              if not actor or not token: raise SystemExit('Missing release actor or token')
              url = 'https://api.gitcode.com/api/v5/repos/cann/asnumpy/collaborators/' + urllib.parse.quote(actor, safe='') + '/permission'
              request = urllib.request.Request(url, headers={'PRIVATE-TOKEN': token})
              with urllib.request.urlopen(request, timeout=30) as response:
                  role = json.load(response).get('role_name', '')
              if role.lower() not in ('maintainer', '维护者'): raise SystemExit('Only Maintainer can trigger release')
              PY
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: ${{ env.compile_image }}
  release:
    name: Release
    pre:
      - type: auto
    fail-fast: false
    jobs:
      JOB_release_x86:
        name: Release_X86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: "Release_X86"
          image: ${{ env.compile_image }}
          arch: "x64"
          ref: ${{ atomgit.sha }}
          download_pr_artifacts: 'false'
      JOB_release_arm:
        name: Release_ARM
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: "Release_ARM"
          image: ${{ env.compile_image }}
          arch: "arm64"
          ref: ${{ atomgit.sha }}
          download_pr_artifacts: 'false'
